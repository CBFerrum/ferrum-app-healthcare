package: healthcare
version: 0.1.0
label: Healthcare
description: "Patients, practitioners' hours, appointments without clashes, consent by form version, and visits billed through ERP with follow-ups"
depends: [core, selling, accounting]

modules:
  - name: healthcare
    label: Healthcare
    icon: stethoscope
    order: 54
    items: [Appointment, Patient, PatientConsent, InsuranceClaim, Practitioner, AppointmentType, ConsentForm, FeeValidity, HealthcareSettings]

roles:
  - name: Healthcare Manager
    description: Sets up practitioners, their hours, appointment types and consent forms, and sees everything.
    permissions:
      - {entity: HealthcareSettings, read: true, write: true, create: true}
      - {entity: Practitioner, read: true, write: true, create: true}
      - {entity: AppointmentType, read: true, write: true, create: true}
      - {entity: ConsentForm, read: true, write: true, create: true}
      - {entity: Patient, read: true, write: true, create: true, export: true, read_groups: [personal, clinical], write_groups: [personal, clinical]}
      - {entity: PatientConsent, read: true, write: true, create: true}
      - {entity: Appointment, read: true, write: true, create: true, export: true, read_groups: [clinical], write_groups: [clinical]}
      - {entity: FeeValidity, read: true}
      - {entity: InsuranceClaim, read: true, write: true, export: true, read_groups: [personal]}
      - {entity: Item, read: true}
      - {entity: Company, read: true}
      - {entity: Customer, read: true}
      - {entity: SalesInvoice, read: true}
  - name: Clinic Reception
    description: Registers patients, books and checks them in, and takes their consent.
    permissions:
      - {entity: Patient, read: true, write: true, create: true, read_groups: [personal, clinical], write_groups: [personal, clinical]}
      - {entity: PatientConsent, read: true, write: true, create: true}
      - {entity: Appointment, read: true, write: true, create: true, read_groups: [clinical], write_groups: [clinical]}
      - {entity: Practitioner, read: true}
      - {entity: AppointmentType, read: true}
      - {entity: ConsentForm, read: true}
      - {entity: FeeValidity, read: true}
      - {entity: InsuranceClaim, read: true, write: true, read_groups: [personal]}
      - {entity: Customer, read: true}
  - name: Practitioner
    description: Sees their patients and completes their visits.
    permissions:
      - {entity: Patient, read: true, read_groups: [personal, clinical]}
      - {entity: Appointment, read: true, write: true, read_groups: [clinical], write_groups: [clinical]}
      - {entity: PatientConsent, read: true}
      - {entity: Practitioner, read: true}
      - {entity: AppointmentType, read: true}

  # The patients' portal as configuration (Ferrum docs/builder/decisions.md BD-02): a patient's own
  # record, their visits, cancelling one while it may still be cancelled online, and their consents.
  # Nothing in the personal or clinical groups. Given by administrators to portal people.
  - name: Patient Portal
    description: For patients on the portal - their own record, visits and consents, reached by the address they sign in with.
    portal: true
    permissions:
      - {entity: Patient, read: true, via: email}
      - {entity: Appointment, read: true, via: patient.email, actions: [cancel_appointment]}
      - {entity: PatientConsent, read: true, create: true, via: patient.email}

personal_data:
  - {entity: Patient, match: email, phone: mobile, name: patient_name, retain: "Medical records, kept as long as health law requires"}
  - {entity: Appointment, match: patient, retain: "Medical records, kept as long as health law requires"}
  - {entity: PatientConsent, match: patient, retain: "Evidence of the consent given or withdrawn"}
  - {entity: FeeValidity, match: patient, retain: "Billing records"}
  - {entity: InsuranceClaim, match: patient, retain: "Billing records"}
